[tool.poetry]
name = "rest-framework-project-5"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
django = "^5.2.5"
python-dotenv = "^1.1.1"
psycopg2-binary = "^2.9.10"
djangorestframework = "^3.16.1"
redis = "^6.4.0"
django-filter = "^25.1"
djangorestframework-simplejwt = "^5.5.1"
coverage = "^7.10.5"
drf-yasg = "^1.21.10"
django-cors-headers = "^4.7.0"
requests = "^2.32.5"
celery = "^5.5.3"
eventlet = "^0.40.3"
django-celery-beat = "^2.8.1"


[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
ipython = "^9.5.0"


[tool.poetry.group.lint.dependencies]
mypy = "^1.17.1"
black = "^25.1.0"
isort = "^6.0.1"

[tool.black]
line_length = 119
exclude = '''
(
  /(
    \.git          # в корне проекта
  )/
)
'''

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

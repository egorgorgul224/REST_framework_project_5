services:
  web:
    image: ovegr8/rest_project_5:latest
    command: bash -c "python manage.py collectstatic -c --noinput && python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      TELEGRAM_URL: ${TELEGRAM_URL}
      BOT_TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - static_files:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_files:/app/static
    depends_on:
      - web

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    env_file:
      - .env
    image: redis:6
    volumes:
      - redis_data:/data

  celery:
    image: ovegr8/rest_project_5:latest
    environment:
      SECRET_KEY: ${SECRET_KEY}
      REDIS_HOST: redis
      POSTGRES_HOST: db
    command: bash -c "celery -A config  worker -l INFO"
    depends_on:
      - db
      - redis
      - web

  celery_beat:
    image: ovegr8/rest_project_5:latest
    environment:
      SECRET_KEY: ${SECRET_KEY}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
    command: bash -c "celery -A config beat -l INFO -S django"
    depends_on:
      - db
      - redis
      - web
      - celery

volumes:
  postgres_data:
  static_files:
  redis_data:
  media_volume:
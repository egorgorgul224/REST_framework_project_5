services:
  web:
    image: ${DOCKER_HUB_USERNAME}/rest_project_5:${GITHUB_SHA}
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - static_volume:/app/static
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_started

  migrate:
    image: ${DOCKER_HUB_USERNAME}/rest_project_5:${GITHUB_SHA}
    command: python manage.py migrate --noinput
    restart: "no"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  static_collector:
    image: ${DOCKER_HUB_USERNAME}/rest_project_5:${GITHUB_SHA}
    command: python manage.py collectstatic --noinput
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles

  nginx:
    image: ${DOCKER_HUB_USERNAME}/mynginx:${GITHUB_SHA}
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/static
    depends_on:
      web:
        condition: service_started

  db:
    image: postgres:17
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    env_file:
      - .env
    image: redis:6
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 2s
      timeout: 2s
      retries: 5

  celery:
    image: ${DOCKER_HUB_USERNAME}/rest_project_5:${GITHUB_SHA}
    command: celery -A config  worker -l INFO
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: celery -A config inspect ping
      interval: 10s
      timeout: 5s
      retries: 5

  celery_beat:
    image: ${DOCKER_HUB_USERNAME}/rest_project_5:${GITHUB_SHA}
    command: celery -A config beat -l INFO -S django
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: celery -A config inspect ping
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  static_volume:
  redis_data: